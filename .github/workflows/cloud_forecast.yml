
name: Cloud Electricity Forecast

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Forecast issue slot"
        required: true
        type: choice
        options:
          - morning
          - afternoon
  schedule:
    - cron: "15 6 * * *"
      timezone: "Europe/Helsinki"
    - cron: "15 16 * * *"
      timezone: "Europe/Helsinki"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: electricity-forecast-cloud
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      slot: ${{ steps.gate.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          FORECAST_REQUESTED_SLOT: ${{ inputs.slot }}
        run: python scripts/cloud_gate.py

  forecast:
    timeout-minutes: 45
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore SQLite history
        uses: actions/cache/restore@v4
        with:
          path: data/electricity_forecaster.sqlite3
          key: forecast-db-${{ github.run_id }}
          restore-keys: |
            forecast-db-

      - name: Run forecast
        env:
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
          PYTHONUNBUFFERED: "1"
          FORECAST_ISSUE_SLOT: ${{ needs.gate.outputs.slot }}
        run: |
          echo "FORECAST_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          python scripts/cloud_runner.py

      - name: Validate output
        run: python scripts/cloud_validate.py

      - name: Build publication status
        run: python scripts/build_forecast_status.py

      - name: Archive successful forecast
        run: python scripts/cloud_archive.py --slot ${{ needs.gate.outputs.slot }}

      - name: Audit forecast history
        if: success()
        run: python scripts/audit_forecast_history.py --days 14

      - name: Preserve forecast snapshot
        uses: actions/upload-artifact@v4
        with:
          name: forecast-${{ needs.gate.outputs.slot }}-${{ github.run_id }}
          path: data/forecast_archive/
          retention-days: 90

      - name: Preserve production logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-logs-${{ github.run_id }}
          path: logs/*.log

      - name: Save SQLite history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/electricity_forecaster.sqlite3
          key: forecast-db-${{ github.run_id }}

      - name: Persist latest forecast and status to main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the freshly generated production outputs outside the worktree
          # while synchronising with main.  This avoids non-fast-forward failures
          # if main changed while the forecast was running.
          cp output/latest_forecast.json "$RUNNER_TEMP/latest_forecast.json"
          cp output/forecast_status.json "$RUNNER_TEMP/forecast_status.json"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/latest_forecast.json" output/latest_forecast.json
            cp "$RUNNER_TEMP/forecast_status.json" output/forecast_status.json
            git add -f output/latest_forecast.json output/forecast_status.json

            if git diff --cached --quiet; then
              echo "Production output is already current on main."
              break
            fi

            git commit -m "Update latest production forecast [skip ci]"
            if git push origin HEAD:main; then
              break
            fi

            echo "main changed during publish; retrying ($attempt/3)"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not publish forecast after 3 synchronised attempts."
              exit 1
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - id: deployment
        uses: actions/deploy-pages@v4
