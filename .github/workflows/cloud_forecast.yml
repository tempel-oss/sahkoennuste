
name: Cloud Electricity Forecast

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Forecast issue slot"
        required: true
        type: choice
        options:
          - morning
          - afternoon
      force_republish:
        description: "Allow rerunning an already published slot (manual repair/test only)"
        required: false
        type: boolean
        default: false
  schedule:
    # GitHub Actions cron is UTC. Keep both EEST/EET candidates; cloud_gate.py
    # accepts only the one that maps to 06:15 / 16:15 Europe/Helsinki.
    - cron: "15 3 * * *"
    - cron: "15 4 * * *"
    - cron: "15 13 * * *"
    - cron: "15 14 * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: electricity-forecast-cloud
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      slot: ${{ steps.gate.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          FORECAST_REQUESTED_SLOT: ${{ inputs.slot }}
          FORECAST_FORCE_REPUBLISH: ${{ inputs.force_republish }}
        run: python scripts/cloud_gate.py

  forecast:
    timeout-minutes: 45
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore SQLite history
        uses: actions/cache/restore@v4
        with:
          path: data/electricity_forecaster.sqlite3
          key: forecast-db-${{ github.run_id }}
          restore-keys: |
            forecast-db-

      - name: Run forecast
        env:
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
          PYTHONUNBUFFERED: "1"
          FORECAST_ISSUE_SLOT: ${{ needs.gate.outputs.slot }}
        run: |
          echo "FORECAST_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          python scripts/cloud_runner.py

      - name: Validate output
        run: python scripts/cloud_validate.py

      - name: Build publication status
        run: python scripts/build_forecast_status.py

      - name: Archive successful forecast
        run: python scripts/cloud_archive.py --slot ${{ needs.gate.outputs.slot }}

      - name: Audit forecast history
        if: success()
        run: python scripts/audit_forecast_history.py --days 14

      - name: Preserve forecast snapshot
        uses: actions/upload-artifact@v4
        with:
          name: forecast-${{ needs.gate.outputs.slot }}-${{ github.run_id }}
          path: data/forecast_archive/
          retention-days: 90

      - name: Preserve production logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-logs-${{ github.run_id }}
          path: logs/*.log

      - name: Save SQLite history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/electricity_forecaster.sqlite3
          key: forecast-db-${{ github.run_id }}

      - name: Verify generated publication bundle
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path("output")
          required = [
              out / "latest_forecast.json",
              out / "forecast_status.json",
              out / "latest_forecast.html",
              out / "index.html",
              out / "diagnostics.html",
          ]
          missing = [str(p) for p in required if not p.exists() or p.stat().st_size == 0]
          if missing:
              raise SystemExit("Missing/empty publication files: " + ", ".join(missing))

          forecast = json.loads((out / "latest_forecast.json").read_text(encoding="utf-8"))
          status = json.loads((out / "forecast_status.json").read_text(encoding="utf-8"))
          run_id = forecast.get("forecast_run_id")
          issue = forecast.get("forecast_issue_time")
          if not run_id or run_id != status.get("forecast_run_id"):
              raise SystemExit("Publication bundle run_id mismatch")
          if issue != status.get("forecast_issue_time"):
              raise SystemExit("Publication bundle issue_time mismatch")

          # Both rendered pages must have been built from this same forecast run,
          # not inherited from an older checkout.
          html = (out / "latest_forecast.html").read_text(encoding="utf-8")
          index = (out / "index.html").read_text(encoding="utf-8")
          if run_id not in html or run_id not in index:
              raise SystemExit("Rendered HTML is stale or not tied to the current forecast run")

          print(f"Publication bundle verified for {run_id} / {issue}")
          PY

      - name: Persist complete publication bundle to main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep every dynamic file generated by this exact forecast run outside
          # the worktree while synchronising with main. This prevents stale HTML
          # from surviving a reset and keeps JSON + HTML + diagnostics atomic.
          mkdir -p "$RUNNER_TEMP/forecast-publication"
          cp output/latest_forecast.json "$RUNNER_TEMP/forecast-publication/"
          cp output/forecast_status.json "$RUNNER_TEMP/forecast-publication/"
          cp output/latest_forecast.html "$RUNNER_TEMP/forecast-publication/"
          cp output/index.html "$RUNNER_TEMP/forecast-publication/"
          cp output/diagnostics.html "$RUNNER_TEMP/forecast-publication/"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            cp "$RUNNER_TEMP/forecast-publication/latest_forecast.json" output/latest_forecast.json
            cp "$RUNNER_TEMP/forecast-publication/forecast_status.json" output/forecast_status.json
            cp "$RUNNER_TEMP/forecast-publication/latest_forecast.html" output/latest_forecast.html
            cp "$RUNNER_TEMP/forecast-publication/index.html" output/index.html
            cp "$RUNNER_TEMP/forecast-publication/diagnostics.html" output/diagnostics.html

            git add -f               output/latest_forecast.json               output/forecast_status.json               output/latest_forecast.html               output/index.html               output/diagnostics.html

            if git diff --cached --quiet; then
              echo "Complete publication bundle is already current on main."
              break
            fi

            git commit -m "Update complete production forecast bundle [skip ci]"
            if git push origin HEAD:main; then
              break
            fi

            echo "main changed during publish; retrying ($attempt/3)"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not publish complete forecast bundle after 3 synchronised attempts."
              exit 1
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - id: deployment
        uses: actions/deploy-pages@v4
