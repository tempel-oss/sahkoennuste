name: Challenger fixed export 41243159131
on:
  workflow_dispatch:
  push:
    branches: ['research/export-41243159131-challenger']
    paths: ['.github/workflows/challenger_v2.yml']
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MATCHED_CACHE: forecast-db-41209280706
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-challenger-v2.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13057673798'
          run-id: '41243159131'
          github-token: ${{ github.token }}
          path: fixed_export
          merge-multiple: true
      - uses: actions/cache/restore@v4
        with:
          path: data/electricity_forecaster.sqlite3
          key: forecast-db-41209280706
          fail-on-cache-miss: true
      - name: Verify fixed export equals original cache tables
        run: |
          python - <<'PY'
          import sqlite3,json,pathlib
          e=sqlite3.connect('file:fixed_export/cloud_training_export.sqlite3?mode=ro',uri=True)
          c=sqlite3.connect('file:data/electricity_forecaster.sqlite3?mode=ro',uri=True)
          result={}
          for t in ['price_forecast_runs','price_forecasts_hourly']:
              cols=[r[1] for r in e.execute('pragma table_info('+t+')')]
              q='select '+','.join(cols)+' from '+t
              er=sorted(e.execute(q).fetchall(),key=repr)
              cr=sorted(c.execute(q).fetchall(),key=repr)
              assert er==cr,t+' differs from pinned export'
              result[t]=len(er)
          for t in ['market_prices','price_runs']:
              result[t]=c.execute('select count(*) from '+t).fetchone()[0]
              assert result[t]>0
          pathlib.Path('research_results').mkdir(exist_ok=True)
          pathlib.Path('research_results/source_verification.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - name: Train and compare with frozen historical holdout
        run: |
          set -o pipefail
          python research/challenger_v2_research.py | tee research_v2_summary.log
          cat research_results/challenger_v2/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save research results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: challenger-fixed-export-41243159131-${{ github.run_id }}
          path: |
            research_results/
            research_v2_summary.log
          retention-days: 90
