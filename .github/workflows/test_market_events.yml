name: Market-event tests

on:
  pull_request:
    paths:
      - 'scripts/collect_market_events.py'
      - 'src/electricity_forecaster/production_output.py'
      - 'tests/test_market_events*.py'
      - '.github/workflows/test_market_events.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-entsoe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only ENTSO-E smoke check
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        run: python scripts/smoke_market_events_live.py
  market-events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed Python modules
        run: python -m py_compile scripts/collect_market_events.py scripts/production_runner.py src/electricity_forecaster/production_output.py
      - name: Run offline regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_market_events*.py' -v
