name: Residual Challenger research
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/challenger_research.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install numpy pandas scikit-learn joblib tzdata
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: data/electricity_forecaster.sqlite3
          key: challenger-research-${{ github.run_id }}
          restore-keys: |
            forecast-db-
          fail-on-cache-miss: true
      - name: Train on temporary copy and print aggregate metrics
        env:
          MATCHED_CACHE: ${{ steps.restore.outputs.cache-matched-key }}
        run: python research/train_cloud_research.py
