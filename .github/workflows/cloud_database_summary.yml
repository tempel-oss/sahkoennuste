name: Cloud database coverage summary
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloud_database_summary.yml'
permissions:
  contents: read
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: data/electricity_forecaster.sqlite3
          key: coverage-summary-${{ github.run_id }}
          restore-keys: |
            forecast-db-
          fail-on-cache-miss: true
      - name: Print aggregate counts and dates only
        env:
          MATCHED_CACHE: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          python - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          p = Path('data/electricity_forecaster.sqlite3').resolve()
          if not os.environ.get('MATCHED_CACHE', '').startswith('forecast-db-') or not p.is_file():
              raise SystemExit('Forecast cache missing')
          con = sqlite3.connect(p.as_uri() + '?mode=ro', uri=True)
          queries = {
              'runs_by_day_utc': """SELECT date(issue_time) AS day, count(*) AS runs
                  FROM price_forecast_runs GROUP BY 1 ORDER BY 1""",
              'scoring_by_day_utc': """SELECT date(created_at) AS day, count(*) AS rows,
                  count(DISTINCT forecast_run_id) AS runs
                  FROM price_forecast_scores GROUP BY 1 ORDER BY 1""",
              'coverage_by_issue_day_utc': """SELECT date(r.issue_time) AS day,
                  count(*) AS score_rows, count(DISTINCT s.forecast_run_id) AS scored_runs,
                  count(DISTINCT s.forecast_run_id || '|' || s.target_time) AS unique_forecast_targets,
                  count(DISTINCT s.target_time) AS unique_targets
                  FROM price_forecast_scores s JOIN price_forecast_runs r
                  ON r.forecast_run_id=s.forecast_run_id GROUP BY 1 ORDER BY 1""",
              'market_by_day_utc': """SELECT date(valid_time) AS day,
                  count(DISTINCT valid_time) AS target_times
                  FROM market_prices WHERE area='FI' GROUP BY 1 ORDER BY 1""",
              'totals': """SELECT count(*) AS score_rows,
                  count(DISTINCT forecast_run_id) AS scored_runs,
                  count(DISTINCT forecast_run_id || '|' || target_time) AS unique_forecast_targets,
                  count(DISTINCT target_time) AS unique_targets,
                  datetime(min(target_time)) AS first_target_utc,
                  datetime(max(target_time)) AS last_target_utc
                  FROM price_forecast_scores"""
          }
          result = {}
          for name, sql in queries.items():
              cur = con.execute(sql)
              fields = [d[0] for d in cur.description]
              result[name] = [dict(zip(fields, row)) for row in cur.fetchall()]
          con.close()
          print('BEGIN_COVERAGE_SUMMARY')
          print(json.dumps(result, indent=2))
          print('END_COVERAGE_SUMMARY')
          PY
